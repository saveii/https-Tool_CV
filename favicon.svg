  <circle cx="23" cy="22" r="6" fill="#ffffff" />
  
  <!-- Name & Title Lines -->
  <rect x="33" y="18" width="15" height="3" rx="1.5" fill="#ffffff" />
  <rect x="33" y="24" width="10" height="2" rx="1" fill="#93c5fd" />

  <!-- Divider -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />

  <!-- CV Body Lines -->
  <rect x="16" y="37" width="32" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.9" />
  <rect x="16" y="42.5" width="24" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.7" />
  <rect x="16" y="48" width="28" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.7" />

  <!-- Pro Badge Star -->
  <circle cx="48" cy="14" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />
  <path d="M48 11.5L48.8 13.2L50.5 13.5L49.2 14.7L49.6 16.5L48 15.6L46.4 16.5L46.8 14.7L45.5 13.5L47.2 13.2Z" fill="#78350f" />
