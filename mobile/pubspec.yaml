name: tool_system_mobile
description: "Tool System Mobile App (Flutter for Android & iOS) - CV Builder, AI Image Scanner, Video & Translation Tools"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & REST API
  http: ^1.2.0
  
  # State Management & Local Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # Media, Camera & File Picker
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  
  # PDF Viewer & Document Export
  flutter_pdfview: ^1.3.2
  share_plus: ^7.2.2
  url_launcher: ^6.2.4
  
  # UI & Icons
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
