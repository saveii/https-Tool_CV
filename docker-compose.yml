version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: toolcv_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: cvforge_db
      MYSQL_USER: cvuser
      MYSQL_PASSWORD: cvpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # 2. Node.js Backend API & Puppeteer Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: toolcv_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: cvuser
      DB_PASSWORD: cvpassword123
      DB_NAME: cvforge_db
      DB_PORT: 3306
      JWT_SECRET: super_secure_production_jwt_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  # 3. Nginx Web Server & Reverse Proxy (Frontend + SSL)
  web:
    image: nginx:alpine
    container_name: toolcv_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
